# Runtime config for atlas-paper-vae M1 (mirrors specs/atlas_paper_vae_m1_v08.yaml).
experiment_tag: atlas_paper_vae_m1_v08_ood
data_h5ad: cellot/cellot_gpu/datasets/speciesot-human-mouse-hvg/hvg_pearson_residuals_m1_v08.h5ad
data_legacy_dir: atlas-paper-vae/data/m1_v08_legacy
result_dir: atlas-paper-vae/results/atlas_paper_vae_m1_v08_ood

condition_column: condition
source: mouse
target: human
cell_type_key: cell_type_ontology_term_id
holdout_cell_types:
  - CL:0000875

datasplit:
  strategy: toggle_ood
  mode: ood
  test_size: 0.2
  random_state: 0
  stratify: condition

vae:
  z_dimension: 100
  hidden_units: [800, 800]
  alpha: 5.0e-5
  dropout_rate: 0.2
  learning_rate: 0.001
  batch_size: 32
  n_epochs: 300

prediction:
  rule: single_species_delta

eval:
  ncells: [30, 50, 80]
  headline_ncells: 80
  seed: 0
  honest_metrics_path: scgen-cellot-autoresearch/honest_metrics.py
  scgen_code_path: scgen-cellot-ablation/scgen-reproducibility/code

env:
  conda: scgen_tf1
