data:
  type: cell
  source: unst
  target: LPS6
  condition: condition
  path: datasets/scrna-crossspecies/hvg-top1k-train-only.h5ad

dataloader:
  batch_size: 128
  shuffle: true

datasplit:
  holdout: rat
  # Change key to conditon allows swapping
  key: species 
  groupby: ['species', 'condition']
  name: toggle_ood
  mode: ood
  test_size: 500
  random_state: 0
