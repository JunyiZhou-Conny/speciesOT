# scGen for Group C: all T cell subtypes held out.
# Strict OOD: AE never sees CD4, CD8, or thymocytes.
data:
  type: cell
  source: mouse
  target: human
  condition: condition
  path: datasets/speciesot-human-mouse/ae_training_tcell_subtypes_v07.h5ad

dataloader:
  batch_size: 256
  shuffle: true

datasplit:
  groupby: condition
  name: train_test
  test_size: 0.2
  random_state: 0
