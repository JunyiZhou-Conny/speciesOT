[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "speciesot"
version = "0.0.1"
authors = [
  { name="Joshua Price", email="pricejoshuam@gmail.com" },
]
description = "Cross-species transcriptome mapping"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["src"]