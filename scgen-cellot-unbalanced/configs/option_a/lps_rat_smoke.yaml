# Short smoke train (CPU/GPU) to verify WeightedRandomSampler wiring.
# Not for science claims — use lps_rat_balanced.yaml for real runs.

data:
  ae_emb:
    path: ./results/paper_crossspecies_rat_ood/scgen/
  condition: condition
  path: datasets/scrna-crossspecies/hvg-top1k-train-only.h5ad
  source: unst
  target: LPS6
  type: cell
dataloader:
  batch_size: 64
  shuffle: true
datasplit:
  groupby:
  - species
  - condition
  holdout: rat
  key: species
  mode: ood
  name: toggle_ood
  random_state: 0
  stratify: condition
  test_size: 500
device: cpu
model:
  g:
    fnorm_penalty: 1
  hidden_units:
  - 64
  - 64
  - 64
  - 64
  kernel_init_fxn:
    b: 0.1
    name: uniform
  latent_dim: 50
  name: cellot
  softplus_W_kernels: false
optim:
  beta1: 0.5
  beta2: 0.9
  lr: 0.0001
  optimizer: Adam
  weight_decay: 0
training:
  cache_freq: 50
  eval_freq: 25
  logs_freq: 10
  n_inner_iters: 2
  n_iters: 50

uot:
  option: A
  freeze_target: paper_crossspecies_rat_ood
  smoke: true
