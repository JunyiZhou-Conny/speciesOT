data:
  ae_emb:
    path: ./results/speciesot_cd8/speciesot_scgen/
  condition: condition
  path: datasets/speciesot-human-mouse/cd8_holdout_v07.h5ad
  source: mouse
  target: human
  type: cell
dataloader:
  batch_size: 128
  shuffle: true
datasplit:
  groupby: condition
  holdout:
    cell_type_ontology_term_id: CL:0000625
  name: train_test
  random_state: 0
  test_size: 0.2
device: cuda
model:
  g:
    fnorm_penalty: 1
  hidden_units:
  - 64
  - 64
  - 64
  - 64
  kernel_init_fxn:
    b: 0.1
    name: uniform
  latent_dim: 50
  name: cellot
  softplus_W_kernels: false
optim:
  beta1: 0.5
  beta2: 0.9
  lr: 0.0001
  optimizer: Adam
  weight_decay: 0
training:
  cache_freq: 1000
  eval_freq: 250
  logs_freq: 50
  n_inner_iters: 10
  n_iters: 50000
