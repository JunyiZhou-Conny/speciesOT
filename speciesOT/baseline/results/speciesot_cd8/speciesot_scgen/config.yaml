data:
  condition: condition
  path: datasets/speciesot-human-mouse/ae_training_expanded_v07.h5ad
  source: mouse
  target: human
  type: cell
dataloader:
  batch_size: 256
  shuffle: true
datasplit:
  groupby: condition
  name: train_test
  random_state: 0
  test_size: 0.2
device: cuda
model:
  beta: 0.0
  dropout: 0.1
  hidden_units:
  - 256
  - 256
  latent_dim: 50
  name: scgen
optim:
  lr: 0.001
  optimizer: Adam
  weight_decay: 1.0e-05
scheduler:
  gamma: 0.5
  step_size: 100000
training:
  cache_freq: 5000
  eval_freq: 1000
  logs_freq: 100
  n_iters: 50000
