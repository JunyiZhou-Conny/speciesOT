notes: >
  DEPLOYMENT twin of specs/atlas_full_pearson_v08_iid.yaml, differing ONLY in
  hvg_method: mixhvg (the rank-max ensemble of scran / seuratv1 / mv_PFlogPF /
  scran_pos) instead of pearson_residuals. Same cells, same assay filter, same
  architecture, same seed, mode: iid so nothing is withheld.

  Purpose is the one-factor comparison: does ensemble HVG selection produce a
  better deployment model than the single-flavor incumbent? Its ood twin
  currently tops the scorecard at fgc 1.032, but a fraction above 1.0 means the
  prediction beat its own AE reconstruction floor, and that cut's floor (0.139)
  is 74% worse than the pearson_residuals floor (0.080) on the same task. So the
  ensemble may be scoring well against a weaker yardstick rather than predicting
  better -- R2 is 0.920 vs 0.921, indistinguishable. Read the floor before
  reading the fraction.

  Reuses hvg_mixhvg_a_uncapped_v08.h5ad; no new prep.
