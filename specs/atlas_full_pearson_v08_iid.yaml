notes: >
  DEPLOYMENT model for external prediction (BCG). Identical to
  specs/atlas_cd8_uncapped.yaml in every respect except mode: iid instead of
  ood, which toggles the CL:0000625 cells back INTO training. The result is a
  model trained on all 89,760 uncapped full-atlas cells with the v08 assay
  filter enforced and no cell type withheld -- which is what you want when
  predicting a genuinely new dataset, as opposed to the ood twin whose purpose
  is to MEASURE generalization.

  No new prep is required. hub prep writes the holdout cells into the .h5ad and
  applies the holdout at train time, so this reuses
  hvg_pearson_residuals_a_uncapped_v08.h5ad byte for byte. That also means the
  iid and ood models share a gene set exactly, so they are directly comparable
  and one BCG projection serves both.

  Evaluation: the CL:0000625 slice is still scored, but those cells were seen in
  training, so it is an in-distribution check on the transport, not a test of
  extrapolation to an unseen cell type. The ood twin remains the generalization
  yardstick, and BCG is the genuine external test.
