notes: 'Ensemble-HVG ablation of M1 (non-classical monocyte holdout CL:0000875). Byte-for-byte
  identical to specs/m1_modern.yaml except hvg_method: mixhvg instead of pearson_residuals,
  so the only variable is which 1000 genes get selected. mixhvg is a rank-max ensemble
  over scran / seuratv1 / mv_PFlogPF / scran_pos (NOT a union of per-species HVG lists);
  batch handling still follows scanpy''s nanmedian-rank-across-batches rule on species,
  held fixed as the control. Deterministic: scran_pos simulates Poisson counts but is
  pinned to random_state 0 and find_variable_features_mix does not expose a seed.
  Baseline to beat, ncells=80: IMPACT frac_gap_closed_decoded 0.897, AE-scGen 0.588.'
